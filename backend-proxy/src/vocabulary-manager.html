<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coach Vocabulary Manager</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e8ecf3;
        --primary: #2563eb;
        --primary-soft: #eff6ff;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        background: linear-gradient(160deg, #f8f9fd 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1120px;
        margin: 32px auto;
        padding: 0 18px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 26px rgba(17, 24, 39, 0.06);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: 24px;
      }

      .title-wrap p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 10px;
        padding: 9px 12px;
        cursor: pointer;
        font-size: 13px;
      }

      button:hover {
        background: #f9fbff;
      }

      button.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      button.primary:hover {
        filter: brightness(0.96);
      }

      button.danger {
        color: var(--danger);
      }

      .status {
        margin: 8px 0 14px;
        font-size: 13px;
        color: #334155;
        background: var(--primary-soft);
        border: 1px solid #dbeafe;
        border-radius: 10px;
        padding: 8px 10px;
      }

      .table-wrap {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        border-bottom: 1px solid #f1f4fa;
        text-align: left;
        padding: 12px;
        font-size: 13px;
        vertical-align: top;
      }

      th {
        background: #f8fafc;
        color: #4b5563;
        font-weight: 600;
      }

      td.actions {
        min-width: 150px;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid #dbe2ef;
        border-radius: 9px;
        padding: 8px;
        font-size: 13px;
        background: #fff;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #93c5fd;
        box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.2);
      }

      textarea {
        min-height: 64px;
        resize: vertical;
      }

      .row-actions {
        display: flex;
        gap: 8px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 28px 10px;
        font-size: 14px;
      }

      @media (max-width: 760px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .bar {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header">
          <div class="title-wrap">
            <h1>Vocabulary Manager</h1>
            <p>Clean editor for cloud vocabulary synced with your iPhone app.</p>
          </div>

          <div class="bar">
            <button id="reloadBtn">Reload</button>
            <button id="addBtn">Add Item</button>
            <button class="primary" id="saveBtn">Save Changes</button>
          </div>
        </div>

        <div class="status" id="status">Ready.</div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 22%">Phrase</th>
                <th style="width: 35%">Meaning</th>
                <th style="width: 33%">Examples (one per line)</th>
                <th style="width: 10%">Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const tableBody = document.getElementById("tableBody");
      let items = [];

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      const isoNow = () => new Date().toISOString();

      const newVocabularyItem = () => {
        const now = isoNow();
        return {
          id: crypto.randomUUID(),
          createdAt: now,
          sourceSessionID: crypto.randomUUID(),
          phrase: "",
          tag: "Manual",
          meaning: "",
          spokenSentence: "",
          correctedSentence: "",
          exampleSentences: [],
          flashcardState: "new",
          nextReviewAt: now,
          lastReviewedAt: null,
          reviewCount: 0
        };
      };

      const toExamplesArray = (value) =>
        String(value || "")
          .split("\n")
          .map((line) => line.trim())
          .filter(Boolean);

      const render = () => {
        tableBody.innerHTML = "";

        if (items.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" class="empty">No vocabulary yet. Click <strong>Add Item</strong> to create your first word.</td>`;
          tableBody.appendChild(tr);
          return;
        }

        items.forEach((item, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><input data-field="phrase" value="${escapeHtml(item.phrase || "")}" /></td>
            <td><textarea data-field="meaning">${escapeHtml(item.meaning || "")}</textarea></td>
            <td><textarea data-field="exampleSentences">${escapeHtml((item.exampleSentences || []).join("\n"))}</textarea></td>
            <td class="actions">
              <div class="row-actions">
                <button data-action="duplicate">Duplicate</button>
                <button class="danger" data-action="delete">Delete</button>
              </div>
            </td>
          `;

          tr.querySelectorAll("input, textarea").forEach((el) => {
            el.addEventListener("input", (e) => {
              const field = e.target.getAttribute("data-field");
              if (!field) return;
              if (field === "exampleSentences") {
                item.exampleSentences = toExamplesArray(e.target.value);
              } else {
                item[field] = e.target.value;
              }
            });
          });

          tr.querySelector('[data-action="delete"]').addEventListener("click", () => {
            items.splice(index, 1);
            render();
          });

          tr.querySelector('[data-action="duplicate"]').addEventListener("click", () => {
            const clone = {
              ...item,
              id: crypto.randomUUID(),
              sourceSessionID: crypto.randomUUID(),
              createdAt: isoNow()
            };
            items.splice(index + 1, 0, clone);
            render();
          });

          tableBody.appendChild(tr);
        });
      };

      const escapeHtml = (value) =>
        String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");

      const loadCloud = async () => {
        setStatus("Loading cloud vocabulary...");
        try {
          const res = await fetch("/v1/vocabulary/cloud");
          const data = await res.json();
          items = Array.isArray(data.items) ? data.items : [];
          render();
          setStatus(`Loaded ${items.length} items.`);
        } catch (e) {
          setStatus(`Load failed: ${e.message || e}`);
        }
      };

      const saveCloud = async () => {
        setStatus("Saving cloud vocabulary...");
        try {
          const payload = {
            items: items.map((item) => ({
              ...item,
              id: item.id || crypto.randomUUID(),
              sourceSessionID: item.sourceSessionID || crypto.randomUUID(),
              tag: typeof item.tag === "string" ? item.tag : "",
              spokenSentence: typeof item.spokenSentence === "string" ? item.spokenSentence : "",
              correctedSentence: typeof item.correctedSentence === "string" ? item.correctedSentence : "",
              createdAt: item.createdAt || isoNow(),
              nextReviewAt: item.nextReviewAt || item.createdAt || isoNow(),
              flashcardState: item.flashcardState || "new",
              reviewCount: Number.isFinite(Number(item.reviewCount)) ? Number(item.reviewCount) : 0,
              exampleSentences: Array.isArray(item.exampleSentences) ? item.exampleSentences : []
            }))
          };

          const res = await fetch("/v1/vocabulary/cloud", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || `HTTP ${res.status}`);
          }

          setStatus(`Saved ${items.length} items.`);
        } catch (e) {
          setStatus(`Save failed: ${e.message || e}`);
        }
      };

      document.getElementById("reloadBtn").addEventListener("click", loadCloud);
      document.getElementById("saveBtn").addEventListener("click", saveCloud);
      document.getElementById("addBtn").addEventListener("click", () => {
        items.unshift(newVocabularyItem());
        render();
        setStatus("New item added. Fill fields and click Save Changes.");
      });

      loadCloud();
    </script>
  </body>
</html>
